[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-bean"
version = "0.1.0"
description = "Budgeted detection of concerning behavior across AI agent fleets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
