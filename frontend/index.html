<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud-Bean | Fleet Security Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2323262d'/><text x='16' y='22' font-family='sans-serif' font-size='15' font-weight='700' fill='%23f7f8f8' text-anchor='middle'>CB</text></svg>">
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/pages.css">
</head>
<body class="page-overview">
  <header>
    <div class="brand">
      <div class="brand-logo">CB</div>
      <h1>Cloud-Bean</h1>
      <span class="brand-tag">Fleet Security Monitor</span>
    </div>
    <div class="metrics-bar">
      <div class="metric-pill">
        <span class="metric-label">Judge Spend</span>
        <span class="metric-val val-spend" id="metric-spend">$0.0000 / $10.00</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Candidate Groups</span>
        <span class="metric-val val-hub" id="metric-hubs">0</span>
      </div>
      <div class="metric-pill">
        <span class="metric-label">Active Findings</span>
        <span class="metric-val val-alerts" id="metric-alerts">0</span>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <a href="#/overview">Overview</a>
    <a href="#/playback">State Playback</a>
    <a href="#/graph">Graph Observatory</a>
    <a href="#/analytics">Analytics</a>
    <a href="#/findings">Findings</a>
  </nav>

  <main id="view"></main>

  <div id="toast-host"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
